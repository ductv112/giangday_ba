<text x="520.0" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#111">LUỒNG 3: THỢ SỬA CHỮA &amp; XIN CẤP LINH KIỆN TỪ KHO</text><text x="520.0" y="60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#666">Nền tảng: Web/App Thợ kỹ thuật (Trung tâm) - liên kết Module Kho</text><rect x="360.0" y="90" width="320" height="50" rx="25.0" ry="25.0" fill="#E3F3F1" stroke="#00695C" stroke-width="2"/><text x="520.0" y="106.8" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a"><tspan x="520.0" dy="0">Thợ nhận thông báo</tspan><tspan x="520.0" dy="16.5">phân công đơn</tspan></text><rect x="330.0" y="175" width="380" height="55" rx="10" ry="10" fill="#E3F3F1" stroke="#00695C" stroke-width="2"/><text x="520.0" y="194.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a"><tspan x="520.0" dy="0">Thợ đến hiện trường/trung tâm kiểm</tspan><tspan x="520.0" dy="16.5">tra thiết bị</tspan></text><line x1="520.0" y1="140" x2="520.0" y2="175" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="320.0" y="265" width="400" height="65" rx="10" ry="10" fill="#E3F3F1" stroke="#00695C" stroke-width="2"/><text x="520.0" y="289.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a"><tspan x="520.0" dy="0">Chẩn đoán lỗi &amp; cập nhật kết quả kiểm</tspan><tspan x="520.0" dy="16.5">tra lên hệ thống</tspan></text><line x1="520.0" y1="230" x2="520.0" y2="265" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><polygon points="520.0,350.0 635.0,400 520.0,450.0 405.0,400" fill="#FFF1E0" stroke="#E65100" stroke-width="2"/><text x="520.0" y="392.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1a1a"><tspan x="520.0" dy="0">Cần thay thế</tspan><tspa