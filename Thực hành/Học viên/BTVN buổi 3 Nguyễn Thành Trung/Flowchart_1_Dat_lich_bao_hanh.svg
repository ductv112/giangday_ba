<text x="470.0" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#111">LUỒNG 1: KHÁCH HÀNG ĐẶT LỊCH BẢO HÀNH / BẢO DƯỠNG</text><text x="470.0" y="60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#666">Nền tảng: App Mobile (Khách hàng) -&gt; Web Hệ thống (Trung tâm)</text><rect x="340.0" y="90" width="260" height="50" rx="25.0" ry="25.0" fill="#F3E8FA" stroke="#6A1B9A" stroke-width="2"/><text x="470.0" y="106.8" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a"><tspan x="470.0" dy="0">Khách hàng mở App /</tspan><tspan x="470.0" dy="16.5">Đăng nhập</tspan></text><rect x="320.0" y="175" width="300" height="55" rx="10" ry="10" fill="#F3E8FA" stroke="#6A1B9A" stroke-width="2"/><text x="470.0" y="194.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a"><tspan x="470.0" dy="0">Chọn chức năng "Đặt</tspan><tspan x="470.0" dy="16.5">lịch dịch vụ"</tspan></text><line x1="470.0" y1="140" x2="470.0" y2="175" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="280.0" y="265" width="380" height="65" rx="10" ry="10" fill="#F3E8FA" stroke="#6A1B9A" stroke-width="2"/><text x="470.0" y="281.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a"><tspan x="470.0" dy="0">Chọn loại dịch vụ (Bảo hành/Bảo</tspan><tspan x="470.0" dy="16.5">dưỡng/Sửa chữa) &amp; nhập thông tin</tspan><tspan x="470.0" dy="16.5">thiết bị</tspan></text><line x1="470.0" y1="230" x2="470.0" y2="265" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><polygon points="470.0,370.0 590.0,420 470.0,470.0 350.0,420" fill="#FFF1E0" stroke="#E65100" stroke-width="2"/><text x="470.0" y="412.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1a1a"><tspan x="470.0" dy="0">Hình thức thực</tspan><tspan x="470.0" dy="15.5">hiện dịch vụ?</tspan></text><line x1="470.0" y1="330" x2="470.0" y2="370.0" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="-20" y="388" width="280" height="65" rx="10" ry="10" fill="#F3E8FA" stroke="#6A1B9A" stroke-width="2"/><text x="120.0" y="412.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a"><tspan x="120.0" dy="0">Thợ đến tận nhà: nhập địa</tspan><tspan x="120.0" dy="16.5">chỉ khách hàng</tspan></text><polyline points="350.0,420 120,420 120,388" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="180.8" y="395" width="58.4" height="16" fill="white" opacity="0.9"/><text x="210.0" y="408" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#555" font-weight="600">Tại nhà</text><rect x="680" y="388" width="280" height="65" rx="10" ry="10" fill="#F3E8FA" stroke="#6A1B9A" stroke-width="2"/><text x="820.0" y="412.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a"><tspan x="820.0" dy="0">Mang đến trung tâm: chọn</tspan><tspan x="820.0" dy="16.5">chi nhánh gần nhất</tspan></text><polyline points="590.0,420 820,420 820,388" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="689.2" y="395" width="101.60000000000001" height="16" fill="white" opacity="0.9"/><text x="740.0" y="408" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#555" font-weight="600">Tại trung tâm</text><rect x="280.0" y="570" width="380" height="55" rx="10" ry="10" fill="#F3E8FA" stroke="#6A1B9A" stroke-width="2"/><text x="470.0" y="597.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a"><tspan x="470.0" dy="0">Chọn ngày giờ hẹn mong muốn</tspan></text><polyline points="120,453 120,597.5 280.0,597.5" fill="none" strok