th="2" marker-end="url(#arrow)"/><rect x="300.0" y="1005" width="340" height="55" rx="27.5" ry="27.5" fill="#EAF6EC" stroke="#2E7D32" stroke-width="2"/><text x="470.0" y="1024.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a"><tspan x="470.0" dy="0">Hoàn tất đặt lịch -</tspan><tspan x="470.0" dy="16.5">chờ điều phối thợ</tspan></text><line x1="470.0" y1="970" x2="470.0" y2="1005" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="1095" width="16" height="16" rx="3" fill="#F3E8FA" stroke="#6A1B9A" stroke-width="2"/><text x="82" y="1108" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">App Mobile - Khách hàng</text><rect x="269" y="1095" width="16" height="16" rx="3" fill="#E3F3F1" stroke="#00695C" stroke-width="2"/><text x="291" y="1108" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">Web Hệ thống - Trung tâm</text><rect x="485" y="1095" width="16" height="16" rx="3" fill="#EAF6EC" stroke="#2E7D32" stroke-width="2"/><text x="507" y="1108" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">Điểm bắt đầu/kết thúc</text><rect x="680" y="1095" width="16" height="16" rx="3" fill="#FFF1E0" stroke="#E65100" stroke-width="2"/><text x="702" y="1108" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">Điểm quyết định</text>
