    </defs>
<text x="500.0" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#111">LUỒNG 4: KHÁCH HÀNG THEO DÕI TIẾN ĐỘ &amp; THANH TOÁN</text><text x="500.0" y="60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#666">Nền tảng: App Mobile (Khách hàng) &lt;-&gt; Web Hệ thống (Trung tâm)</text><rect x="330.0" y="90" width="340" height="50" rx="25.0" ry="25.0" fill="#E3F3F1" stroke="#00695C" stroke-width="2"/><text x="500.0" y="106.8" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a"><tspan x="500.0" dy="0">Đơn hàng đang được</tspan><tspan x="500.0" dy="16.5">xử lý (real-time)</tspan></text><rect x="310.0" y="175" width="380" height="55" rx="10" ry="10" fill="#F3E8FA" stroke="#6A1B9A" stroke-width="2"/><text x="500.0" y="194.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a"><tspan x="500.0" dy="0">Khách hàng mở mục "Theo dõi đơn</tspan><tspan x="500.0" dy="16.5">hàng" trên App</tspan></text><line x1="500.0" y1="140" x2="500.0" y2="175" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="290.0" y="265" width="420" height="65" rx="10" ry="10" fill="#F3E8FA" stroke="#6A1B9A" stroke-width="2"/><text x="500.0" y="289.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a"><tspan x="500.0" dy="0">Xem trạng thái: Tiếp nhận / Đang sửa / Chờ</tspan><tspan x="500.0" dy="16.5">linh kiện / Hoàn thành</tspan></text><line x1="500.0" y1="230" x2="500.0" y2="265" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="290.0" y="360" width="420" height="60" rx="10" ry="10" fill="#E3F3F1" stroke="#00695C" stroke-width="2"/><text x="500.0" y="381.8" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a"><tspan x="500.0" dy="0">Nhận thông báo báo giá sửa chữa phát sinh</tspan><tspan x="500.0" dy="16.5">(ngoài bảo hành)</tspan></text><line x1="500.0" y1="330" x2="500.0" y2="360" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><polygon points="500.0,440.0 615.0,490 500.0,540.0 385.0,490" fill="#FFF1E0" stroke="#E65100" stroke-width="2"/><text x="500.0" y="474.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1a1a"><tspan x="500.0" dy="0">Khách hàng</tspan><tspan x="500.0" dy="15.5">đồng ý báo</tspan><tspan x="500.0" dy="15.5">giá?</tspan></text><line x1="500.0" y1="420" x2="500.0" y2="440.0" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="10" y="460" width="280" height="70" rx="10" ry="10" fill="#E3F3F1" stroke="#00695C" stroke-width="2"/><text x="150.0" y="478.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a"><tspan x="150.0" dy="0">Điều phối viên liên hệ tư</tspan><tspan x="150.0" dy="16.5">vấn lại / xử lý hủy đơn</tspan><tspan x="150.0" dy="16.5">theo yêu cầu KH</tspan></text><polyline points="385.0,490 150,490 150,530" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="220.8" y="465" width="58.4" height="16" fill="white" opacity="0.9"/><text x="250.0" y="478" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#555" font-weight="600">Từ chối</text><rect x="310.0" y="610" width="380" height="55" rx="10" ry="10" fill="#E3F3F1" stroke="#00695C" stroke-width="2"/><text x="500.0" y="629.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a"><tspan x="500.0" dy="0">Thợ tiếp tục sửa chữa theo báo giá</tspan><tspan x="500.0" dy="16.5">đã duyệt</tspan></text><polyline points="500.0,540.0 500.0,610" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="529.4" y="524" width="51.2" height="16" fill="white" opacity="0.9"/><text x="555.0" y="537" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#555" font-weight="600">Đồng ý</text><rect x="290.0" y="695" width="420" height="60" rx="10" ry="10" fill="#E3F3F1" stroke="#00695C" stroke-width="2"/><text x="500.0" y="716.8" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a"><tspan x="500.0" dy="0">Thợ hoàn tất, cập nhật trạng thái "Hoàn</tspan><tspan x="500.0" dy="16.5">thành" + hình ảnh nghiệm thu</tspan></text><line x1="500.0" y1="665" x2="500.0" y2="695" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="300.0" y="785" width="400" height="55" rx="10" ry="10" fill="#F3E8FA" stroke="#6A1B9A" stroke-width="2"/><text x="500.0" y="804.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a"><tspan x="500.0" dy="0">App: KH nhận thông báo hoàn thành &amp;</tspan><tspan x="500.0" dy="16.5">xem hóa đơn</tspan></text><line x1="500.0" y1="755" x2="500.0" y2="785" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="290.0" y="870" width="420" height="55" rx="10" ry="10" fill="#F3E8FA" stroke="#6A1B9A" stroke-width="2"/><text x="500.0" y="889.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a"><tspan x="500.0" dy="0">KH thanh toán (Online: ví/thẻ/chuyển khoản</tspan><tspan x="500.0" dy="16.5">hoặc Tiền mặt tại TT)</tspan></text><line x1="500.0" y1="840" x2="500.0" y2="870" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="290.0" y="955" width="420" height="55" rx="10" ry="10" fill="#E3F3F1" stroke="#00695C" stroke-width="2"/><text x="500.0" y="974.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a"><tspan x="500.0" dy="0">Web: Kế toán xác nhận thanh toán, xuất hóa</tspan><tspan x="500.0" dy="16.5">đơn điện tử</tspan></text><line x1="500.0" y1="925" x2="500.0" y2="955" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="300.0" y="1040" width="400" height="55" rx="10" ry="10" fill="#F3E8FA" stroke="#6A1B9A" stroke-width="2"/><text x="500.0" y="1059.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1a1a1a"><tspan x="500.0" dy="0">App: KH đánh giá chất lượng dịch</tspan><tspan x="500.0" dy="16.5">vụ/thợ</tspan></text><line x1="500.0" y1="1010" x2="500.0" y2="1040" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="300.0" y="1125" width="400" height="55" rx="27.5" ry="27.5" fill="#EAF6EC" stroke="#2E7D32" stroke-width="2"/><text x="500.0" y="1136.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a"><tspan x="500.0" dy="0">Đóng đơn hàng - lưu</tspan><tspan x="500.0" dy="16">lịch sử bảo hành</tspan><tspan x="500.0" dy="16">thiết bị</tspan></text><line x1="500.0" y1="1095" x2="500.0" y2="1125" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="1240" width="16" height="16" rx="3" fill="#F3E8FA" stroke="#6A1B9A" stroke-width="2"/><text x="82" y="1253" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">App Mobile - Khách hàng</text><rect x="269" y="1240" width="16" height="16" rx="3" fill="#E3F3F1" stroke="#00695C" stroke-width="2"/><text x="291" y="1253" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">Web Hệ thống - Trung tâm</text><rect x="485" y="1240" width="16" height="16" rx="3" fill="#EAF6EC" stroke="#2E7D32" stroke-width="2"/><text x="507" y="1253" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">Bắt đầu/Kết thúc</text><rect x="645" y="1240" width="16" height="16" rx="3" fill="#FFF1E0" stroke="#E65100" stroke-width="2"/><text x="667" y="1253" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">Quyết định</text>
</svg>